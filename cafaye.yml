# cafaye.yml — the cafaye project manifest.
#
# DRAFT. The schema is owned by cafaye/core, not by this repository. This file
# records the shape caf is being built against; when core freezes the manifest
# spec, this file is replaced by `caf init`, which generates it from the schema
# and validates it. Do not add fields here that core does not define.

version: 1

name: caf
description: The cafaye platform CLI.

# The languages in this project, and the toolchain each one is built with. caf
# itself is the Go tool; the other services in the platform are declared the
# same way.
languages:
  - name: go
    version: "1.25"

# The contract packages this project owns. Empty for now: contracts land with
# cafaye/core, and `caf contract` reads them from there.
contracts: []

# Local development stack. `caf dev` reads this to decide what to run; the
# values are defaults only, and every one is overridable by a flag.
dev:
  services: []
