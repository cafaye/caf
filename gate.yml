# gate.yml — how caf is gated, declared rather than guessed.
#
# WHY THIS FILE EXISTS. cafaye/core owns the format
# (`schemas/gate.schema.json`), the checker (`harness/gate_check.py`) and the
# reasoning (`docs/gate.md`). Across the fifteen repositories in the cafaye
# workspace "run the gate" had five different spellings, and every one of them
# was found by a human getting it wrong. This is caf's, and every number in it
# was measured on this tree at de25e37 + caf-07 — not copied from core's, not
# from another service's, and not rounded.
#
# THE GAP THIS CLOSES, in one sentence. `caf-06` merged 12,480 lines across 60
# files, five of them new packages — `internal/ledger`, `internal/ports`,
# `internal/reclaim`, `internal/ryuk` and a CLI surface — into a service whose
# entire job is to notice that a port is occupied and to reclaim what is not,
# and the declaration that says so did not exist. A service that cannot fail is
# worse than no service, because it is trusted.
#
# WHAT THE CHECKER PROVES ABOUT THIS FILE, AND WHAT IT DOES NOT. It proves the
# command resolves, `bin/prime` exists and is executable, `mise run prime`
# resolves to that same file, the CI workflow really invokes it, and — the part
# that matters — that running the gate makes every proof below appear, with the
# three countable ones at or above their floors. It does NOT prove the tests
# touched anything they claim to, and it does not prove a requirement is
# satisfied: a requirement is the operator's to satisfy, before gating. Both
# halves of that are recorded in core's `harness/gate_findings.json` under
# `notEnforced`, and neither is restated here as if this file closed it.
#
# WHAT THIS DECLARATION DELIBERATELY DOES NOT CLAIM. It does not claim the
# container tier ran. caf's live tests assert a property of a *particular*
# container runtime, one of them is red on the machine this was written on, and
# both reasons are measured and written out at `gate.proof[].live-tier` and in
# `external.requirements`. Read that section before concluding the gate covers
# the whole tree.
version: 1
name: caf

gate:
  # An argv, never a shell string, so the exit code is the gate's own. This
  # fleet's one recorded false green was `… | tail -45; echo "PRIME EXIT=$?"`
  # under zsh, where `$?` is tail's and tail is always zero.
  #
  # `bin/prime`, not `mise run prime`. courier has to name mise because its
  # `bin/prime` calls `mix local.hex --force` and dies without mise's shims on
  # PATH; caf's does not — it calls `go`, `go list` and `grep` directly, and
  # needs nothing mise installs to be found. So the shortest true argv is the
  # script, and `mise run prime` is checked below to resolve to the same file.
  command: [bin/prime]
  # The fleet's spelling, cross-checked against `entrypoint` below, so the task
  # a developer runs and the declaration cannot drift onto different files.
  miseTask: prime
  # The file behind the command, and the file `mise run prime` resolves to.
  entrypoint: bin/prime
  # Generous on purpose, and the measurement behind it is in this repository
  # rather than in a guess: a warm `bin/prime` on darwin/arm64 with a populated
  # module cache and build cache took 19.4s wall clock, of which 18.5s was
  # `go test` across 10 packages. A cold checkout has to fetch the module
  # closure, recompile the standard library for the toolchain and run
  # `internal/ci`'s cross-compilation of every release target, which is minutes.
  # A budget tight enough to be a bug detector is tight enough to be a flake
  # generator on somebody's first run; this number exists to stop a hung gate,
  # not to measure one.
  timeoutSeconds: 1800
  proof:
    # Three countable floors and one presence proof, all read out of two lines
    # `bin/prime` prints. They are on two lines because that is what the gate
    # can honestly produce: `go test` has no suite-wide summary of its own, so
    # the counts are counted by `bin/prime` out of `go test -v`'s `--- PASS:`
    # lines. That is the whole reason `bin/prime` grew a `-v` and an accounting
    # section in this packet — before it, `go test` printed one `ok <pkg>`
    # line per package and no test count at all, and there was nothing in this
    # repository a floor could be read from.
    #
    # Every pattern below is anchored at BOTH ends and includes the literal
    # `0 failures`, which is not decoration. It means a floor can only ever be
    # read out of a run in which nothing failed, so the number the ratchet sees
    # is the number a green run reported and never the number on a line printed
    # by a red one. That is the same trick courier's `^Result: ([0-9]+)
    # passed$` uses to refuse a fractional `Result: 300/512 passed`, and the
    # reason is the same: a proof that matches more shapes than it means is a
    # proof that will eventually mean the wrong thing.
    #
    # No escape tolerance anywhere. The checker strips terminal escapes before
    # it matches anything (core c63af27), so a `\x1b` workaround in a pattern
    # would be re-creating the debt this file clears — `kit-15-fleet` is
    # deleting exactly such workarounds elsewhere in the fleet. `go test` does
    # not colourise when its output is not a terminal anyway.
    - id: packages
      match: '^caf: ([0-9]+) packages, [0-9]+ top-level passes, [0-9]+ subtest passes, 0 failures, [0-9]+ skips$'
      # 10, measured with `go list ./...` on this tree, and it is 10 rather
      # than the 9 `ok` lines `go test` prints because `cmd/caf` — the binary
      # every other service's CI shells out to — has no test file and reports
      # `[no test files]`. Counting it is the point: a floor on the `ok` lines
      # alone would be satisfied by a tree in which the entrypoint had stopped
      # being a package.
      #
      # This is the floor that answers requirement 2 of this packet. caf-06
      # added five packages; a gate that quietly stopped covering one of them
      # would still be green on the other four, and the test-count floors below
      # would move by whatever was in the package that went missing. This one
      # does not move at all, so the three together cannot be satisfied by a
      # subset.
      #
      # 11, which is 10 plus `internal/deploy`. That package is the one carrying
      # `caf deploy` and its live tier, so this floor is what makes the floor
      # below move when deploy is tested at all: a deploy that shipped with no
      # tests would leave the suite floor untouched and this one alone would
      # notice the package appearing with nothing in it.
      #
      # 12, which is 11 plus `internal/backup` — `caf backup`, its three live
      # tests and its restic-lock retry. The same argument, one packet on: a
      # backup command that shipped untested would move nothing except this line.
      #
      # 13, which is 12 plus `internal/gen` — `caf gen telemetry`, the generator
      # and its drift gate. It is the first floor in this file to move for a
      # package that added tests to NO other package, which is the whole argument
      # for having a package count at all: a generator that transcribed core's
      # allowlists instead of reading them out of core's schemas would have moved
      # the two test-count floors below and this one not at all, and this line is
      # what makes that visible.
      #
      # 14, which is 13 plus `internal/telemetry` — and that one is the argument
      # for the whole line. `internal/telemetry` is caf's own committed copy of
      # what `caf gen telemetry` writes, so `go build`, `go vet`, `gofmt -l` and
      # `go test` all reach the generated Go and its twelve-test suite. It is the
      # only floor here that moves for code NOBODY WROTE: a generator whose output
      # nothing compiles is a demonstration that rots, and the two floors below
      # count tests in files a generator emitted. Without this line, an emitted Go
      # file that did not compile would still have moved the suite floor — by a
      # number — and nobody would have been sent to the file.
      minimum: 14
    - id: suite
      match: '^caf: [0-9]+ packages, ([0-9]+) top-level passes, [0-9]+ subtest passes, 0 failures, [0-9]+ skips$'
      # 435, measured, and the number is the interesting part of this file.
      #
      # It is a DECREASE-DETECTOR, read from the LAST match: a suite that
      # quietly lost forty tests cannot report itself as passing. 1/1 passes
      # and 3/3 passes are the same claim without a floor, which is the entire
      # argument for `gate.proof[].minimum` existing.
      #
      # 435 is 432 as caf-07 left it, plus three more, and the three are
      # counted rather than assumed: 431 declared as caf-06 left it, caf-07's
      # four to reach 435, caf-09 landing underneath and moving master to 434,
      # and this merge putting caf-07's four on top of that for 438. caf-09's
      # own report predicted 434/437 for this line and was one short in both,
      # because it measured its branch as 430 passes + 3 skips = 433 declared
      # where the branch is 434; so the number below is the measured one and not
      # the predicted one. Not a round number and not an estimate: `bin/prime`
      # printed 435 on this tree, once cold and once replayed from Go's test
      # cache, which is worth saying because `-count=1` is deliberately NOT in
      # the gate — adding it would change what a green `bin/prime` means
      # (AGENTS.md, "Gates").
      #
      # IT WAS NOT 435 WHEN caf-07 MEASURED IT, and that is the whole reason
      # this number is being rewritten in a merge commit rather than in the
      # packet that wrote it. caf-07 branched from caf-06, added its own four,
      # and set the floor from the tree it could see. caf-09 then landed on
      # master underneath it. Each packet was correct about its own tree; the
      # merge is what made both floors wrong, and it did so silently, because a
      # floor is a claim about the present and every other merge invalidates it
      # without touching this file. Nothing in either packet's own run could have
      # caught it. This is the third repository in a row where a floor drifted
      # below the suite it describes — billing's went unnoticed and produced a
      # false green, and this one is caught red only because caf-07 also wrote
      # the test that checks the identity, which is the whole reason it went red
      # here and not there.
      #
      # IT IS ALSO A SKIP DETECTOR, and that is a consequence rather than a
      # design. The tree declares 438 top-level tests; three of them are the two
      # live tests and the re-exec'd child, and on this machine exactly those
      # three skip and all 435 run. So the identity
      #
      #     declared (438) - this floor (435) == 3 skips
      #
      # holds on both sides, and `internal/ci` asserts it exactly — in both
      # directions — so a test added without this line raised is a red, and so is
      # a skip that appeared without it. Run this gate as root and
      # `TestLintReportsAnUnreadableManifest` skips, 434 is reported, and the
      # gate goes red. That is correct, and it is the same property
      # `.github/workflows/ci.yml`'s `root-gated` job asserts by hand, reached
      # here without a second workflow step.
      #
      # That test is core's ratchet and caf now has it. This line is the only
      # place in caf that writes down how many tests there are, and the first
      # version of it in this packet was wrong in a way worth recording: it
      # counted tests *containing* a `t.Skip` as the number the floor may not
      # reach, which came out at fifteen because most of caf's skips are
      # machine-capability ones that do not fire here, and the assertion could
      # not go red. `TestTheGateFloorIsNotBelowTheSuiteCafClaimsToHave` is the
      # exact version, and it was watched going red on this very floor before
      # this number was corrected.
      #
      # caf-21 added 72 top-level tests, in `internal/deploy` and
      # `internal/cli`, and moved this floor from 435 to 506. The arithmetic is
      # `declared - minimum == expectedSkips` and it is exact in both directions:
      # 511 declared, 5 skips, so 506 run. The skips grew from 3 to 5 because the
      # live deploy tier added two env-gated tests, and `expectedSkips` in
      # `internal/ci/prime_test.go` is what says so — a new live test without
      # that number moving fails this test rather than quietly widening the gate.
      #
      # caf-22 added 86 more, in `internal/backup` and `internal/cli`, and moved
      # this floor to 589. The arithmetic moves the same way and for the same
      # reason: 597 declared, 8 skips, so 589 run. The skips grew from 5 to 8
      # because caf-22's three live tests are the same kind of env-gated test
      # caf-21's two were — they skip on `CAF_LIVE_KAMAL` — and a new skip is a new
      # tier, so it is named at `expectedSkips` rather than absorbed here.
      #
      # caf-29 added 8, all in `internal/dev`, and moved this floor to 597. The
      # arithmetic is unchanged and so is the reason it moved: 605 declared, 8
      # skips, so 597 run.
      #
      # caf-30 added 6 more, also in `internal/dev`, and moved it to 603: 611
      # declared, 8 skips, so 603 run. Three are the infrastructure-as-dependency
      # cases (postgres, redis, and `-no-infra` still winning), one is that a
      # catalog need not name infrastructure to get it, one is the unknown-
      # dependency sentence, and one is the rendered document carrying a
      # dependency twice. None is env-gated, so `expectedSkips` stays at 8. The skip count did NOT move, which is the part worth
      # stating — none of these seven is env-gated, so a new test did not arrive
      # as a new tier, and `expectedSkips` stays at 8. A commit that added a test
      # which skipped would have had to move that number too, and this comment is
      # where the two would otherwise drift apart silently.
      # caf-33 added 2, both in `internal/cli`, and moved this floor to 605: 613
      # declared, 8 skips, so 605 run. Neither is env-gated, so `expectedSkips`
      # stays at 8 — same reason as caf-30's seven.
      #
      # The two are `TestDevReportsASubprocessFailureTheRouterWouldSwallow` and
      # `TestAChildStatusStillPassesThrough`, and they are a pair on purpose:
      # one proves an `*exec.ExitError` must NOT match `exitCoder`, the other
      # proves caf's own `childStatus` still does. Fixing the first by deleting
      # the pass-through branch would sail past both unless the second were
      # there, which is why `caf env up`'s status is a floor and not a detail.
      #
      # caf-contract-01 added 33, all in `internal/contract` and `internal/cli`,
      # and moved this floor to 638: 646 declared, 8 skips, so 638 run. The skip
      # count did NOT move, for the same reason as caf-30's seven: nothing here
      # is env-gated, so no new test arrived as a new tier. They are the tier
      # table's ten rows, the classifier's changes, the numeric lints' shapes and
      # the stability gate — and the subtest floor below is what notices the
      # difference between a new test and a new `t.Run` inside an existing one.
      #
      # MEASURED TWICE, because it was wrong twice first: at 637 against a tree
      # declaring 646, which failed `TestTheGateFloorIsNotBelowTheSuiteCafClaims-
      # ToHave` in exactly the way it is supposed to. That is the ratchet working
      # and not a problem with it — the number was taken from an earlier state of
      # the tree, and the tree moved because three more tests landed in the same
      # commit.
      #
      # caf-gen-01 added 38, in `internal/gen` (18, a new package), `internal/contract`
      # (12) and `internal/cli` (8), and moved this floor to 643: 651 declared, 8
      # skips, so 643 run. `expectedSkips` stays at 8 for the same reason every
      # packet since caf-29 gives: none of the thirty-eight is env-gated, so no new
      # test arrived as a new tier.
      #
      # Most of them are in `internal/gen`, and the number is the point of the packet
      # rather than a side effect of it. `caf gen telemetry` emits the OpenTelemetry
      # setup a service needs to honour core's telemetry contract, and a generator
      # whose output nobody checks is a generator whose idea of correct is whatever
      # it happens to do — so the eighteen are mostly the two directions that matter:
      # every value read out of core reaches the emitted bytes, and two runs over one
      # manifest produce identical bytes. The emitted `otel-endpoint.json` is
      # additionally handed to core's own vendored schema before it is written, which
      # is the one check that cannot share the generator's blind spot, and the
      # negative half of that is asserted too — a validation that only ever sees
      # documents it agrees with has proved nothing.
      #
      # 651 DECLARED IS A NUMBER THIS PACKET HAD TO FIX ITS OWN WALKER TO REACH, and
      # the wrong number was the interesting one. `internal/ci` counts
      # `func TestX(t *testing.T)` over the tree; this packet puts the drift gate's
      # goldens in `internal/gen/testdata/` as real Go files, the golden
      # `telemetry_test.go` declares twelve top-level tests, and `go test` runs none
      # of them because the go toolchain excludes `testdata` from every package.
      #
      # So the walker said 663 and the gate reported 650, and the ratchet named
      # twenty-one skips where `expectedSkips` says eight. Twenty-one is a number
      # nobody can account for, which is the whole reason this ratchet exists: it
      # caught a defect in the check rather than a missing floor. The fix went into
      # `internal/ci`'s notion of what a test is — `testdata` is now excluded like
      # `.git` and `vendor` — and NOT into `expectedSkips`, because raising the floor
      # to match a count that includes tests `go test` never runs is precisely the
      # "edit the assertion to make it green" that this test's own comment forbids,
      # and it would have left a floor no run of any gate could satisfy.
      #
      # caf-contract-01 and caf-gen-01 each raised this floor on their own branch,
      # and both were merged into master in one merge. Summing two branch-local
      # measurements would be arithmetic, not a measurement, so the number below
      # was re-measured on the merged tree with bin/prime. Both rationales are
      # kept because both describe real tests that are still in the tree.
      #
      # 687, which is 676 plus the eleven top-level tests inside
      # `internal/telemetry/telemetry_test.go` — eleven that were ALREADY in the
      # tree, declared, counted by this file's own walker, and never run by
      # anything. `testdata` is excluded from every package by the go toolchain,
      # so a generator whose golden lived there produced twelve tests that no
      # `go test` on any machine would ever execute. They moved to a real package
      # and now run. `expectedSkips` stays at 8 for the same reason every packet
      # since caf-29 gives: none of the eleven is env-gated, so no new test
      # arrived as a new tier.
      minimum: 687
    - id: subtests
      match: '^caf: [0-9]+ packages, [0-9]+ top-level passes, ([0-9]+) subtest passes, 0 failures, [0-9]+ skips$'
      # 537, measured, and it is a different detector from the one above.
      # 965 `--- PASS:` lines minus the 428 that were top-level, so 537. A test
      # moved from `func TestX` to a subtest of another test keeps the suite
      # floor's total and loses this one's, and only this floor notices. One
      # number that counted everything would be satisfied by that refactor
      # silently; two numbers that count different things are not.
      #
      # 558, which is 537 plus the 21 subtests caf-21's deploy tables added. The
      # suite floor above cannot see the difference between a new test and a new
      # `t.Run` inside an existing one; this floor can, and it is the reason
      # caf-21's tables are tables rather than a sequence of asserts.
      #
      # 652, which is 558 plus the 94 subtests caf-22's tables added — the contract
      # violations, the shell-escaping shapes, the restic-transcript shapes and the
      # step tables are all rows rather than sequences for this reason, and every
      # one of them is a refusal or a decision somebody will one day have to read
      # the name of.
      #
      # 654, which is 652 plus the 2 subtests caf-29's catalog-message table
      # added. This floor is the one that noticed: `TestTheCatalogErrorReadsAs-
      # ASentenceAtEveryCount` is one top-level test with a row per count, so
      # the suite floor above could not tell it from a single new test, and
      # would have been satisfied by the suite floor alone. The two counts are
      # rows because the message was wrong at BOTH of them — "dropped 1 it", and
      # then "dropped them%!(EXTRA int=3)" — and a defect that only appears at
      # one value of a parameter is a defect a single-case test cannot see.
      #
      # 760, which is 654 plus the 106 subtests caf-contract-01's tables added,
      # and the shape of this packet is why that number is so much larger than
      # the suite floor's 32. Nearly everything here is a TABLE and almost nothing
      # is a function: the tier derivation is ten rows, the classifier is thirteen
      # rows, the numeric lints are eighteen, the stability gate is seven and the
      # tier-selection flag is eleven. That is the packet's argument in its
      # structure — a rule with a tier is a row somebody has to check by reading
      # rather than a number somebody has to trust — and it is also why the suite
      # floor alone would have been nearly blind to this packet: 107 rows spread
      # across 33 tests is the case this floor exists for.
      #
      # MEASURED AS 761, and set one lower on purpose, which is the one place in
      # this file that is not a measurement. It was first written as 760 from a
      # run reporting 760; three later runs of the same tree all reported 761. The
      # difference is `internal/ci`'s reachability checks over the `//go:build`
      # surface, whose subtest count depends on what is reachable for the platform
      # being built — and this file is read on more than one. Setting the floor
      # one below the measurement is safe in the direction that matters: a subtest
      # floor of N still detects a suite that shrank when it is set to N-1, and a
      # run reporting MORE than the floor passes. A floor that has to be exactly
      # right to avoid flaking is a flake generator, which is the mistake
      # `timeoutSeconds` above this section exists to avoid.
      #
      # RE-MEASURED AT 831 ON THE MERGED TREE, and set one lower for the reason
      # above. caf-gen-01 added the drift tables (`internal/gen/drift_test.go`) and
      # the telemetry allowlist table (`internal/contract/telemetry_test.go`), and
      # both are rows rather than functions — which is exactly the case this floor
      # exists for, and why it moved 70 while the suite floor moved 32.
      #
      # 862, which is 831 plus the thirty-one rows inside the generated
      # `internal/telemetry/telemetry_test.go`. Every one of them is a table row
      # written by `caf gen telemetry` from the same contract tables as the setup
      # it tests — which is the argument for generating the tests and not just the
      # setup, and the reason this floor moved further than the suite floor did.
      # The measurement is 862 and the floor is one lower, for the reason above.
      minimum: 861
    #
    # THE ONE WITH NO FLOOR, and the schema sanctions that: a `minimum` is
    # omitted "for a proof that reports nothing countable (a step that must
    # appear in the log, a tier that must not say it skipped)". This is the
    # second kind, and it is the load-bearing proof of the four.
    #
    # `bin/prime` prints, on every run in every mode, how many of the live
    # tests actually ran. So the fast gate is a run in which the container tier
    # did not execute and the gate's own output says so, in a line the
    # declaration matches. Delete that line from `bin/prime`, or move it, or
    # rename it, and this proof never appears: `gate.proof-missing`, a FAILURE.
    # A skip that a declaration requires to be *stated* cannot be a silent pass.
    #
    # The literal `7` in the pattern is the ratchet, and it is a quadruple
    # ratchet kept honest by `internal/ci`: it is the size `bin/prime` writes in
    # `LIVE_TIER`, the length of the `LIVE_TESTS` list beside it, the size in
    # this pattern, and the size
    # `tests/gate-declaration-self-test.sh` reads out of this pattern for its
    # stand-in gate. `TestTheGateAccountsForEveryLiveTest` fails if the first
    # three and the tree's env-gated tests stop being the same set, and the
    # self-test fails if the fourth goes stale — which it did, twice: caf-21 added
    # the two deploy live tests and the stand-in still printed "0 of 2", and caf-22
    # added three backup ones and the stand-in still printed a number that did not
    # match. Both times the stand-in control went red naming a proof this file
    # still declared. All four halves are now derived rather than written down. A
    # fifth live test added anywhere in this repository therefore turns something
    # red on purpose.
    #
    # WHY THERE IS NO `minimum` ON IT, which is a decision and not an
    # oversight. A floor of 4 would be the honest reading of "the live tier
    # must not be satisfiable by a run where it never executed" — and it would
    # make the declared gate red on every machine without a container runtime,
    # including a bare GitHub runner, for the whole of the ordinary suite. The
    # declared gate is therefore the fast gate, and the enforcement of "the live
    # tier must have run" lives in `bin/prime --live`, which exits nonzero when
    # the tier did not execute. That mode exists for exactly this and is
    # asserted by `tests/gate-declaration-self-test.sh`.
    #
    # The two measurements that decided it, both on this machine (OrbStack
    # 29.4.0), both reproducible with one command each:
    #
    #   CAF_LIVE_DOCKER=1 go test -run TestTheSilentCollisionIsReal ./internal/ports/
    #     -> PASS, 4.45s
    #   CAF_LIVE_RYUK=1 go test -run TestAClosedLeaseReapsAndAnOpenOneDoesNot ./internal/ryuk/
    #     -> FAIL: the reaper did not acknowledge the filter: … EOF
    #
    # The first is OrbStack-specific BY CONSTRUCTION, and not by accident of
    # this machine: its first subtest is `t.Fatalf` when `docker run` succeeds
    # in shadowing a host listener, and its second is `t.Fatalf` when a second
    # container is allowed onto the same port. Both are failures, not skips, so
    # on a runtime that arbitrates properly — plain dockerd, which is what
    # `runs-on: ubuntu-latest` gives this repository's CI — the test does not
    # degrade to a skip, it goes red. A gate carrying it would be red on every
    # GitHub-hosted runner in the fleet.
    #
    # The second is red here, now, on the machine caf-06's own report says it
    # was verified on. It is a finding, not a reason to shrink the tier, and it
    # is not fixed by this packet: see REPORT-caf-07-gate.md.
    #
    # THE TWO DEPLOY LIVE TESTS, added by caf-21, and why they are in the tier.
    #
    #   CAF_LIVE_KAMAL=1 go test -run 'TestADeploy' -v ./internal/deploy/
    #     -> both PASS, on this machine
    #
    # They build an SSH host, boot Kamal's own registry, and run a real rolling
    # rollout against a real kamal-proxy, then read back what answered over the
    # proxy. They are demonstrations rather than checks for the reason the first
    # two are: they need `kamal` and a container runtime, and they take minutes.
    # What they are not is hypothetical — a deploy engine that stopped deploying
    # would leave every other test in this repository green, because every other
    # test asserts on argv. The one that answers "does it actually work" is here.
    #
    # THE THREE BACKUP LIVE TESTS, added by caf-22, for the same reason and by
    # one step further: a restore is not a restore until something has come back
    # out of it, and every other test in this repository asserts on argv.
    #
    #   CAF_LIVE_KAMAL=1 go test -run 'TestABackupIsTaken|TestABrokenPair|TestAProductionLooking' \
    #     -v ./internal/backup/
    #     -> all three PASS, on this machine (40.2s, 17.3s, 23.2s in one process)
    #
    # They boot `ghcr.io/crmne/kamal-backup:0.5.2` through a real
    # `kamal accessory boot all` against a real Postgres, take a real pg_dump into
    # a real restic repository, restore it into a scratch database and assert the
    # rows came back. The second breaks the two files apart by one removed
    # `env.secret` entry and asserts the refusal happens BEFORE the boot; the third
    # is the one a copy of somebody else's rule would also pass, and only the real
    # gem settles it.
    - id: live-tier
      match: '^caf: live tier: [0-9]+ of 7 executed'

external:
  # NOT self-contained, and saying so is the point. `bin/prime` needs a Go
  # toolchain this repository pins rather than ships, and a module fetch on a
  # cold checkout. A declaration that called this self-contained would be
  # describing a gate nobody has ever run on a clean machine — the same defect
  # as identity's suite being green against a database nobody had migrated,
  # told the other way round.
  selfContained: false
  requirements:
    - kind: toolchain
      # The pin, from two places that already have to agree: mise.toml's
      # `[tools] go` and go.mod's `go` directive, which `internal/ci` asserts
      # against the literal CI passes to kit's reusable workflow. 1.25.0 is
      # also the floor imposed by `internal/mcp`'s SDK, whose own directive is
      # 1.25.0 — a module cannot depend on a patch release newer than its own
      # directive claims.
      name: Go 1.25.0 on PATH — the pin in mise.toml and in go.mod's go directive
      satisfy:
        # A bare name, so the checker reports `gate.requirement-unproven` and
        # deliberately leaves the exit code alone. That is the correct
        # severity: this is a claim about THIS MACHINE, and a checker that
        # failed on it would be red on a laptop and green on CI.
        #
        # `mise install` is the command that materialises the pin, and it is
        # not quite sufficient on its own: `bin/prime` calls `go` directly, so
        # the toolchain has to be on PATH as well, which on this fleet means
        # mise's shims (`mise activate`) or an explicit `mise exec`. The `unmet`
        # line says so rather than leaving a reader to find out from a 127.
        command: [mise, install]
        unmet: >-
          bin/prime exits 127 at its first step with "go: not found" or
          "go: command not found" in the message
    - kind: network
      # "ONCE, on a cold checkout" and not flatly, because that is the honest
      # scope: `go mod download` is `bin/prime`'s first step and it is the only
      # step that touches the network. A warm gate was measured at 19.4s with
      # the module cache populated and the network untouched, so calling this
      # gate networked would over-claim a cost it does not always pay.
      name: >-
        the Go module proxy, ONCE, on a cold checkout only — three direct
        dependencies and their closure. A warm gate needs no network.
      satisfy:
        # The argv that actually reaches the network, and it is a bare name for
        # the same reason as the toolchain above.
        command: [go, mod, download]
        unmet: >-
          go mod download exits nonzero on a cold checkout with no network, and
          bin/prime never reaches go build
    - kind: service
      # THIS ONE IS NOT A REQUIREMENT OF THE DECLARED GATE, and it is listed
      # anyway, because the alternative is a live tier that exists only in two
      # files' comments. Read the whole of it:
      #
      #   * `bin/prime` — the command above — does NOT need a container
      #     runtime. It runs green on a machine with no `docker` on PATH, and
      #     that is a measured fact, not an assumption: it is what the three
      #     `--- SKIP` lines on every run are.
      #   * `bin/prime --live` DOES need one, and fails without it.
      #
      # So this entry is a requirement of the repository's *second* gate mode,
      # recorded here so the operator knows what `--live` will ask of the
      # machine before running it on one that is not theirs — which matters
      # more than usual for this service, because `internal/ryuk/live_test.go`
      # starts a container with the Docker socket mounted and a reaper that
      # removes what a filter matches. That test asserts its own filter is
      # non-empty and matches nothing before it starts, and asserts a control
      # container and every pre-existing container on the machine are intact
      # afterwards. Read those comments before running it anywhere that is not
      # yours; the requirement being listed is not an endorsement of running it
      # anywhere.
      #
      # WHAT IS DELIBERATELY NOT HERE, because listing it would be a different
      # kind of lie: this requirement is conditional, and the three above are
      # not.
      name: >-
        a container runtime, for `bin/prime --live` ONLY — the seven live tests
        that the declared gate skips. Not needed by `bin/prime` itself.
      satisfy:
        # A bare name, so it warns rather than failing. `docker version` rather
        # than `docker --version` on purpose, and for the reason this
        # repository's own `doctor` documents: `--version` succeeds whether or
        # not a daemon is answering, so only `docker version` settles whether a
        # runtime is actually there to start anything.
        command: [docker, version]
        unmet: >-
          bin/prime --live exits nonzero with "no container runtime on PATH" from
          live_test.go, or the live tier reports 0 of 7 executed
  # NOT required, and named so nobody goes looking for them:
  #   * no database and no service beyond the conditional one above. Nothing in
  #     the gate opens a socket to anything but the loopback interface;
  #     `internal/ports`' tests bind `127.0.0.1` and `::1` and nothing else.
  #   * no credential, and no secret of any kind. caf reads no token, key or JWT
  #     anywhere in this tree, and this declaration introduces none: every
  #     `satisfy.command` above is a binary name. The live tier touches the
  #     Docker socket, and the reaper connection carries a session label and
  #     nothing else — a `key=value` filter that `internal/ryuk` refuses to
  #     produce empty, because an empty filter at the daemon means "remove
  #     everything" on a machine with somebody else's containers on it.
  #   * no filesystem path outside this repository. The Go build cache, the
  #     module cache and `bin/prime`'s own mktemp log are all outside the tree
  #     and all written by the toolchain rather than by the gate.

ci:
  workflow: .github/workflows/ci.yml
  # `bin/prime`, and every element of it has to appear in some `run:` body of
  # the workflow or this is `gate.ci-disagrees` — a FAILURE, and the finding
  # that means CI and the local gate have drifted into two different gates.
  #
  # The plain one-line spelling, deliberately, and it is already the shape
  # caf's workflow uses at ci.yml's `the gate a developer runs` step:
  # `run: ./bin/prime`. As of core 63fd319 the checker reads every `run:`
  # spelling — one-liners, `- run:` sequence items, and bare `run:` with the
  # value on the lines below — so there is no longer any reason to reach for an
  # awkward block scalar to be visible. Nothing in this packet changes
  # `.github/workflows/ci.yml`, and `internal/ci`'s
  # `TestTheGateJobRunsTheGateAndTheLockfileGuard` continues to assert that the
  # `gate` job runs this command and carries the lockfile guard beside it.
  invokes: [bin/prime]
