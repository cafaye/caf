# EXPECTED FAILURE — the JSON Schema accepts this file; the caf cross-field
# rules in docs/manifest-conventions.md do not.
#
# Rule: a service never consumes its own events. billing publishes
# invoice.created and also subscribes to it, which is a bus round trip to
# itself. If it needs to react to its own output it should call itself
# in-process.
#
# Not a core example: core ships this rule as a review rule plus an assertion
# over its own examples. caf-02 made it a lint rule, and this file is the
# fixture that pins it.
name: billing
description: A manifest that listens to its own queue.
language: ruby
core: ^0.1.0

exposes:
  events:
    - invoice.created

consumes:
  - invoice.created

repository:
  url: git@github.com:cafaye/billing.git
  defaultBranch: master
  visibility: public

owner:
  team: billing
  contact: billing@cafaye.com
