# cafaye.yml — identity: a Go service that serves an HTTP API and publishes events.
# Validated by tests/test_specs.py against schemas/cafaye.manifest.schema.json.
name: identity
description: Authentication, sessions, MFA, OAuth, accounts/tenancy and the OIDC provider.
language: go
core: ^0.1.0

exposes:
  api: openapi/openapi.yaml
  events:
    - user.created
    - user.email_verified
    - account.created
    - member.invited
    - member.joined
    - member.removed
    - member.role_changed
    - mfa.enabled
    - mfa.disabled
    - session.revoked
    # Long form: the bare entity name "key" is generic enough to collide
    # across services, so the publisher is spelled out. See docs/event-naming.md.
    - identity.api_key.created
    - identity.api_key.revoked

repository:
  url: git@github.com:cafaye/identity.git
  defaultBranch: master
  visibility: public

owner:
  team: identity
  contact: identity@cafaye.com
